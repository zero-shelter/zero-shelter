name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The org allows only actions/checkout and requires SHA pinning, so this
# workflow uses the Node preinstalled on each runner instead of setup-node.
# That costs us the Node 20/22 dimension — tracked in "restore the Node version
# matrix in CI".

jobs:
  test:
    # The OS matrix is the point: fingerprints must be identical on every host,
    # so a green run on one of them proves nothing on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: node --version

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  # The install experience, checked against the packaged tarball on the two
  # platforms most people install on. This script has caught more real problems
  # than any other check here — a deleted feature, a claim about pnpm that was
  # only true through --input, a second scanner erasing the upgrade commands —
  # and every one of them was invisible to the unit tests. Windows is included
  # because it is the platform none of us develops on.
  install-experience:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      - run: npm run build

      - run: npm run qa

  third-party:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      # THIRD_PARTY.md is what anyone auditing this package reads to find out
      # what it pulls in. Regenerating it in CI keeps it from drifting away
      # from package.json between releases.
      - run: npm run third-party

      - name: Fail if either THIRD_PARTY file is stale
        run: git diff --exit-code THIRD_PARTY.md THIRD_PARTY.ko.md

  # The tool, run on this repository, by this repository. A security tool that
  # its own CI does not run is a claim rather than a product — and this job is
  # the only place the whole path (scanner subprocess, ingest, judgement,
  # SARIF, exit code) executes as a user would run it. The unit tests drive
  # everything from fixtures on purpose, so they cannot catch a break here.
  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      - run: npm run build

      # Cross-source reconciliation is the claim this project is built on, and
      # until now our own CI ran a single source — so the path that does the
      # reconciling was never exercised outside fixtures. Pinned by version and
      # verified by checksum: a security tool that curls an unverified binary
      # into its own pipeline has no standing to lecture anyone about supply
      # chains.
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Both sources must have run
        run: |
          node dist/bin.js judge --json > judged.json || true
          node -e "
            const { readFileSync } = require('node:fs');
            const skipped = JSON.parse(readFileSync('judged.json', 'utf8')).skipped;
            const complaint = skipped.find((note) => note.startsWith('osv-scanner'));
            if (complaint) throw new Error('osv-scanner did not contribute: ' + complaint);
            console.log('npm audit and osv-scanner both reported');
          "

      # No runtime dependencies, so a finding here means a devDependency needs
      # attention. Exit 1 is a real failure: we have nothing recorded as
      # accepted, and adding a baseline to silence our own tool would be the
      # exact behaviour this project exists to argue against.
      - run: node dist/bin.js judge

      - name: Also produce the SARIF a user would upload
        if: always()
        run: node dist/bin.js judge --format sarif --output zero-shelter.sarif

      # Parsed, not required: a .sarif extension makes require() treat the file
      # as JavaScript, which fails on the first colon and says nothing useful
      # about the SARIF.
      - name: Fail if the SARIF is not valid JSON with a run in it
        if: always()
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const r = JSON.parse(readFileSync('zero-shelter.sarif', 'utf8'));
            if (r.version !== '2.1.0') throw new Error('version is ' + r.version);
            if (!Array.isArray(r.runs) || r.runs.length !== 1) throw new Error('expected exactly one run');
            console.log('SARIF ok:', r.runs[0].results.length, 'result(s)');
          "
