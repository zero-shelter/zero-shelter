name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The organization allows only SHA-pinned actions/checkout. The OS matrix uses
# preinstalled Node; the node20 job checks the declared floor separately (#154).

jobs:
  test:
    # Bound stalled jobs below the GitHub default timeout (#158).
    timeout-minutes: 15

    # Check fingerprints and tests across the supported runner operating systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: node --version

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  # Install a pinned, checksum-verified Node 20 release to test the support floor
  # independently of changing runner images and hosted tool-cache availability.
  node20:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 20 with a pinned checksum
        shell: bash
        run: |
          set -euo pipefail
          node_version="20.20.2"
          archive="node-v${node_version}-linux-x64.tar.xz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/node20"
          curl --fail --silent --show-error --location \
            --output "$archive_path" \
            "https://nodejs.org/dist/v${node_version}/${archive}"
          echo "df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d  $archive_path" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xJf "$archive_path" --strip-components=1 --directory "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/node" --version

      - run: node --version

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

  # Install the packaged tarball on Linux and Windows to cover packaging, scanner
  # execution and platform behavior beyond unit fixtures.
  install-experience:
    # Allow registry requests, with a job timeout beyond the script timeout.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      - run: npm run build

      - run: npm run qa

      # Check hook context, skills, HTML prompts and the plugin manifest.
      - run: npm run qa:agent

  third-party:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      # Compare generated dependency notices with the committed files.
      - run: npm run third-party

      - name: Fail if either THIRD_PARTY file is stale
        run: git diff --exit-code THIRD_PARTY.md THIRD_PARTY.ko.md

  # Run scanner subprocesses, ingestion, judgement and outputs on this repository.
  self:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      - run: npm run build

      # Exercise both scanner sources using a pinned, checksum-verified OSV binary.
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Both sources must have run
        run: |
          node dist/bin.js judge --json > judged.json || true
          node -e "
            const { readFileSync } = require('node:fs');
            const skipped = JSON.parse(readFileSync('judged.json', 'utf8')).skipped;
            const complaint = skipped.find((note) => note.startsWith('osv-scanner'));
            if (complaint) throw new Error('osv-scanner did not contribute: ' + complaint);
            console.log('npm audit and osv-scanner both reported');
          "

      # This repository has no accepted baseline; outstanding development dependency
      # findings fail this step. Do not add acceptance merely to silence CI.
      - run: node dist/bin.js judge

      - name: Also produce the SARIF a user would upload
        if: always()
        run: node dist/bin.js judge --format sarif --output zero-shelter.sarif

      # Read SARIF as JSON; require() treats the .sarif extension as JavaScript.
      - name: Fail if the SARIF is not valid JSON with a run in it
        if: always()
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const r = JSON.parse(readFileSync('zero-shelter.sarif', 'utf8'));
            if (r.version !== '2.1.0') throw new Error('version is ' + r.version);
            if (!Array.isArray(r.runs) || r.runs.length !== 1) throw new Error('expected exactly one run');
            console.log('SARIF ok:', r.runs[0].results.length, 'result(s)');
          "
