name: Publish

# Publish an Owner-approved GitHub Release using npm OIDC trusted publishing
# and provenance. This workflow does not use an NPM_TOKEN.
# The npm trusted publisher names zero-shelter/zero-shelter and publish.yml;
# update that configuration before renaming this workflow.

on:
  release:
    types: [published]
  # Retry a failed release run. npm refuses a version already on the registry.
  workflow_dispatch:

permissions:
  contents: read
  # Allow npm to verify the GitHub OIDC token.
  id-token: write

jobs:
  publish:
    # Bound stalled release jobs (#158).
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use an npm version supporting OIDC trusted publishing.
      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - run: npm run build

      # Run tests as a separate step as well as through prepublishOnly.
      - run: npm test

      - name: Check this version is not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "zero-shelter@$VERSION" version > /dev/null 2>&1; then
            echo "zero-shelter@$VERSION is already on the registry."
            echo "Bump the version in package.json — npm never lets a version be reused."
            exit 1
          fi
          echo "publishing zero-shelter@$VERSION"

      - name: Publish
        run: npm publish --provenance --access public
