name: Question
description: Ask about usage, design, or contributions
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: |
        Describe what you want to understand about usage, design, or contributions.
        Version numbers and reproduction steps are optional for questions;
        maintainers may ask for them if needed.
    validations:
      required: true
