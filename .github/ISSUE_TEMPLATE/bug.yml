name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
  - type: bug
  - status: proposed
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest input or fixture that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node.js version, zero-shelter commit/package version
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Do not include secrets or private data.
