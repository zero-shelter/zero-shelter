# Upload dependency findings to the Security tab and fail when judge fails.
# Copy to .github/workflows/. A baseline is optional: commit one only after
# reviewing and accepting the recorded risks. New findings can also come from
# advisory or scanner changes, not only from the code in a pull request.

name: dependencies

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required to upload SARIF

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci

      # OSV is an optional additional source for this npm example. Verify the checksum
      # for the pinned version and platform; this one is v2.5.0 linux/amd64.
      # See skills/ci/SKILL.md for package-manager-specific guidance.
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner

      # Continue so SARIF can upload when findings are present; the final step fails
      # the job when judge failed. It does not distinguish exit 1 from exit 2.
      - name: Judge
        id: judge
        continue-on-error: true
        run: npx zero-shelter judge --format sarif --output zero-shelter.sarif

      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: zero-shelter.sarif

      - name: Fail if this change introduced something new
        if: steps.judge.outcome == 'failure'
        run: |
          echo "New dependency findings. Run 'npx zero-shelter judge --explain' locally."
          exit 1
